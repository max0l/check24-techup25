definitions:
  data.OfferResponse:
    properties:
      Countadults:
        example: 2
        type: integer
      Countchildren:
        example: 1
        type: integer
      HotelName:
        example: Hotel Sunshine
        type: string
      HotelStars:
        example: 4.5
        type: number
      Inboundarrivalairport:
        example: LAX
        type: string
      Inboundarrivaldatetime:
        example: "2023-10-01T15:00:00Z"
        type: string
      Inbounddepartureairport:
        example: FRA
        type: string
      Inbounddeparturedatetime:
        example: "2023-10-15T12:00:00Z"
        type: string
      Mealtye:
        example: All Inclusive
        type: string
      Ocenview:
        example: true
        type: boolean
      Outboundarrivalairport:
        example: FRA
        type: string
      Outboundarrivaldatetime:
        example: "2023-10-15T09:00:00Z"
        type: string
      Outbounddepartureairport:
        example: LAX
        type: string
      Outbounddeparturedatetime:
        example: "2023-10-01T12:00:00Z"
        type: string
      Price:
        example: 299.99
        type: number
      Rommtype:
        example: Deluxe Suite
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  title: Techup25
paths:
  /hotel/{hotelid}:
    get:
      description: handles hotel requests and returns the hotel information.
      parameters:
      - description: ID of the hotel
        in: path
        name: hotelid
        required: true
        type: integer
      responses:
        "200":
          description: Hotel information
          schema:
            type: body
        "400":
          description: Bad Request
        "404":
          description: Hotel Not Found
      summary: handles hotel requests
  /offers:
    get:
      description: handles offer requests and returns a list of offers.
      parameters:
      - collectionFormat: csv
        description: List of departure airports, e.g. FRA, MUC
        in: query
        items:
          type: string
        name: DepartureAirports
        required: true
        type: array
      - description: Earliest departure date in format RFC3339
        in: query
        name: EarliestDepartureDate
        required: true
        type: string
      - description: Latest return date in format RFC3339
        in: query
        name: LatestReturnDate
        required: true
        type: string
      - description: Number of adults
        in: query
        name: CountAdults
        required: true
        type: integer
      - description: Number of children
        in: query
        name: CountChildren
        type: integer
      - description: Duration of the trip in days
        in: query
        name: Duration
        required: true
        type: integer
      - description: Site, e.g. 1 or 2
        in: query
        name: Site
        required: true
        type: integer
      responses:
        "200":
          description: List of offers matching the request
          schema:
            items:
              $ref: '#/definitions/data.OfferResponse'
            type: array
        "400":
          description: Bad Request
        "404":
          description: No Offers Found
      summary: handles offer requests
swagger: "2.0"
