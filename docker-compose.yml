services:
  db:
    image: postgres:17-alpine3.22
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-check24}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-user}", "-d", "${POSTGRES_DB:-check24}"]
      interval: 5s
      timeout: 4s
      retries: 5
  seed_data:
    build:
      context: .
      dockerfile: ./cmd/migrate/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_DSN: host=${POSTGRES_HOST:-db} port=5432 user=${POSTGRES_USER:-user} dbname=${POSTGRES_DB:-check24} password=${POSTGRES_PASSWORD:-password} sslmode=disable
    command: ["-hotel /offer.csv", "-hotel /hotels.csv"]
    restart: "no"
    volumes:
      - ./testCSVs/small/offer.csv:/offer.csv
      - ./data/hotels.csv:/hotels.csv
  api:
    build:
      context: .
      dockerfile: ./cmd/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      seed_data:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    restart: always

volumes:
  db_data: