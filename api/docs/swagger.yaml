host: localhost:8080
info:
  contact: {}
  title: Techup25
paths:
  /hotel/{hotelid}:
    get:
      description: handles hotel requests and returns the hotel information.
      parameters:
      - description: ID of the hotel
        in: path
        name: hotelid
        required: true
        type: integer
      - description: Site, e.g. 1 or 2
        in: query
        name: site
        required: true
        type: integer
      - collectionFormat: csv
        description: List of departure airports, e.g. FRA, MUC
        in: query
        items:
          type: string
        name: departureAirports
        type: array
      - description: Earliest departure date in format RFC3339
        in: query
        name: earliestDepartureDate
        type: string
      - description: Latest return date in format RFC3339
        in: query
        name: latestReturnDate
        type: string
      - description: Number of adults
        in: query
        name: countAdults
        required: true
        type: integer
      - description: Number of children
        in: query
        name: countChildren
        type: integer
      - description: Duration of the trip in nights
        in: query
        name: duration
        type: integer
      responses:
        "200":
          description: Hotel information
          schema:
            $ref: '#/definitions/data.HotelOffersResponse'
        "400":
          description: Bad Request
        "404":
          description: Hotel Not Found
      summary: handles hotel requests
  /offers:
    get:
      description: handles offer requests and returns a list of offers.
      parameters:
      - collectionFormat: csv
        description: List of departure airports, e.g. FRA, MUC
        in: query
        items:
          type: string
        name: departureAirports
        required: true
        type: array
      - description: Earliest departure date in format RFC3339
        in: query
        name: earliestDepartureDate
        required: true
        type: string
      - description: Latest return date in format RFC3339
        in: query
        name: latestReturnDate
        required: true
        type: string
      - description: Number of adults
        in: query
        name: countAdults
        required: true
        type: integer
      - description: Number of children
        in: query
        name: countChildren
        type: integer
      - description: Duration of the trip in nights
        in: query
        name: duration
        required: true
        type: integer
      - description: Site, e.g. 1 or 2
        in: query
        name: site
        type: integer
      responses:
        "200":
          description: List of offers matching the request
          schema:
            $ref: '#/definitions/data.BestOfferPerHotelResponse'
        "400":
          description: Bad Request
        "404":
          description: No Offers Found
      summary: handles offer requests
swagger: "2.0"
