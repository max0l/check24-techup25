services:
  db:
    image: postgres:17-alpine3.22
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-check24}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-user}", "-d", "${POSTGRES_DB:-check24}"]
      interval: 5s
      timeout: 4s
      retries: 5
  seed_data:
    build:
      context: .
      dockerfile: ./cmd/migrate/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_DSN: host=${POSTGRES_HOST:-db} port=5432 user=${POSTGRES_USER:-user} dbname=${POSTGRES_DB:-check24} password=${POSTGRES_PASSWORD:-password} sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      SEED_DATA: ${SEED_DATA:-true}
      SKIP_INVALID_HOTELS: ${SKIP_INVALID_HOTELS:-true}
    command: ["-hotel", "/hotels.csv", "-offer", "/offers.csv"]
    restart: "no"
    volumes:
      - ../offers/offer.csv:/offers.csv
      - ./data/hotels.csv:/hotels.csv
  api:
    build:
      context: .
      dockerfile: ./cmd/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      seed_data:
        condition: service_completed_successfully
    environment:
      DATABASE_DSN: host=${POSTGRES_HOST:-db} port=5432 user=${POSTGRES_USER:-user} dbname=${POSTGRES_DB:-check24} password=${POSTGRES_PASSWORD:-password} sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      REDIS_DB: ${REDIS_DB:-0}

    ports:
      - "8080:8080"
    restart: always
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    restart: always
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-password}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 4s
      retries: 5
    volumes:
      - cache:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    ports:
      - "8090:3000"
    restart: always
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: curl --fail http://localhost:8090 || exit 1
      interval: 60s
      retries: 5
      start_period: 20s
      timeout: 10s

volumes:
  db_data:
  cache: